# Example Freqtrade configuration for Niblit adapter integration
# Copy this to your Freqtrade config directory and customize.

max_open_trades: 5
stake_currency: USDT
stake_amount: 50
tradable_balance_ratio: 0.99
dry_run: true
dry_run_wallet: 1000

# ── Exchange ──────────────────────────────────────────────────────────────────
exchange:
  name: binance
  key: ""
  secret: ""
  pair_whitelist:
    - BTC/USDT
    - ETH/USDT
  pair_blacklist:
    - ".*DOWN/USDT"
    - ".*UP/USDT"

# ── REST API server (required for Niblit adapter) ────────────────────────────
api_server:
  enabled: true
  listen_ip_address: 127.0.0.1
  listen_port: 8080
  username: freqtrader
  password: "change_me"
  verbosity: "error"
  enable_openapi: false
  jwt_secret_key: "change_me_too"

# ── Strategy ──────────────────────────────────────────────────────────────────
strategy: NiblitAiMaster
strategy_path: ../freqtrade_strategies/

# ── Risk ──────────────────────────────────────────────────────────────────────
stoploss: -0.03
trailing_stop: true
trailing_stop_positive: 0.02
trailing_stop_positive_offset: 0.04

# ── Timeframe ─────────────────────────────────────────────────────────────────
timeframe: 1h
startup_candle_count: 200