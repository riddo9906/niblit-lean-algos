[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niblit_lean_algos"
version = "0.1.0"
description = "Niblit Lean Algorithms — paper, freqtrade, and lean trading backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Niblit Contributors" },
]
keywords = ["trading", "paper", "freqtrade", "lean", "niblit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "ccxt>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "niblit_lean_algos*",
    "adapters*",
    "algorithms*",
    "api*",
    "cli*",
    "config*",
    "configs*",
    "docs*",
    "domain*",
    "examples*",
    "freqtrade_bridge*",
    "freqtrade_strategies*",
    "nibblebots*",
    "niblit_bridge*",
    "persistence*",
    "risk*",
    "runtime_traces*",
    "scripts*",
    "services*",
    "tests*",
]

# The root modules (manager.py, main.py) are imported as top-level modules by the
# authoritative implementation (e.g. `from manager import TradingRuntimeManager` inside
# both root manager.py and the niblit_lean_algos wrappers). Expose them explicitly so
# the editable/venv install can import them without sys.path hacks.
[tool.setuptools]
py-modules = ["manager", "main"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]